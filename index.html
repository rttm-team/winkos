<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <title>Winko's Hockey Pool</title>
    <meta name="description" content="Fantasy hockey prospect tracker, GM roster management, and mandatory promotion watch for Winko's Hockey Pool." />
    <meta property="og:title" content="Winko's Hockey Pool" />
    <meta property="og:description" content="Fantasy hockey prospect tracker, GM roster management, and mandatory promotion watch for Winko's Hockey Pool." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" id="theme-color-meta" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('winkos_theme') || 'light';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0f172a');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0f172a] text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
